apiVersion: apps/v1
kind: Deployment
metadata:
  name: tre-app
  labels:
    app: tre-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tre-app
  template:
    metadata:
      labels:
        app: tre-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tre-app
          image: tre-team/app:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tre-db
                  key: password
            - name: TRANSLATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tre-api
                  key: token
---
apiVersion: v1
kind: Service
metadata:
  name: tre-app
  labels:
    app: tre-app
spec:
  type: ClusterIP
  selector:
    app: tre-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tre-app
  labels:
    app: tre-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tre-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tre-app
  labels:
    app: tre-app
spec:
  podSelector:
    matchLabels:
      app: tre-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
